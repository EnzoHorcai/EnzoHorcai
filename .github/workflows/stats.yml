name: Atualizar GitHub Stats

on:
  schedule:
    - cron: "17 */6 * * *" # a cada 6 horas: pega repositórios novos automaticamente
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/stats.yml"]

jobs:
  stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # STATS_TOKEN (PAT com escopos repo + read:user) inclui repositórios privados.
      # Sem ele, cai no GITHUB_TOKEN e conta apenas os públicos.
      TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Card de estatísticas
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&count_private=true&include_all_commits=true&theme=tokyonight&hide_border=true&bg_color=0D1117&locale=pt-br
          path: profile/stats.svg
          token: ${{ env.TOKEN }}

      - name: Card de linguagens mais usadas
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&theme=tokyonight&hide_border=true&bg_color=0D1117&locale=pt-br
          path: profile/top-langs.svg
          token: ${{ env.TOKEN }}

      - name: Commit dos cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: atualiza GitHub stats" || exit 0
          git push
