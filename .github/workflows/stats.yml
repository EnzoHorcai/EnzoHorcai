name: Atualizar GitHub Stats

on:
  schedule:
    - cron: "17 */6 * * *" # a cada 6 horas: pega repositórios novos automaticamente
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/stats.yml", "scripts/cards.mjs"]

jobs:
  stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # STATS_TOKEN (PAT com escopos repo + read:user) inclui repositórios privados.
      # Sem ele, cai no GITHUB_TOKEN e conta apenas os públicos.
      TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cards de estatísticas e linguagens
        env:
          STATS_TOKEN: ${{ env.TOKEN }}
        run: |
          npm install --no-save --no-package-lock @stats-organization/github-readme-stats-core@2.2.0
          node scripts/cards.mjs

      - name: Gráfico de contribuições (snake)
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ env.TOKEN }}
          outputs: |
            profile/snake.svg
            profile/snake-dark.svg?palette=github-dark

      - name: Commit dos cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: atualiza GitHub stats" || exit 0
          git push
